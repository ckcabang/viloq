# Render Blueprint: the app's image plus a managed Postgres, the same pair
# `compose.yaml` runs locally. Create it from the Render dashboard with
# New > Blueprint, pointing at this repo; later pushes to `main` redeploy.
# Spec: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: viloq
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # The image serves the frontend at `/`; a 200 there means uvicorn is up
    # and startup (which creates the tables) got through.
    healthCheckPath: /
    envVars:
      # The image's uvicorn listens on 8000; Render otherwise expects 10000.
      - key: PORT
        value: "8000"
      # Render's internal URL, `postgresql://...`; `backend/config.py` adds the
      # psycopg driver to it.
      - key: VILOQ_DATABASE_URL
        fromDatabase:
          name: viloq-db
          property: connectionString
      # Off: with it on, the sign-in response hands back the token, so anyone
      # could sign in as any email. Sign-in needs a mailer before it works here.
      - key: VILOQ_EXPOSE_MAGIC_LINK
        value: "0"

databases:
  - name: viloq-db
    databaseName: viloq
    user: viloq
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "18"
    # Reachable only from services in this workspace, not the internet.
    ipAllowList: []
