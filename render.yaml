# Render Blueprint: two independent copies of the app's image plus a managed
# Postgres, the same pair `compose.yaml` runs locally. Render builds nothing:
# both services pull the image CI built, from ghcr.io/ckcabang/viloq.
#
#   production   viloq      + viloq-db      https://viloq.onrender.com
#   development  viloq-dev  + viloq-dev-db  https://viloq-dev.onrender.com
#
# Each service reads only its own database; nothing is shared between them.
# A service's onrender.com address comes from its name when it is created and
# never changes, so these names are what fix the addresses above. Renaming one
# here would make Render create a fresh resource, with a new address, and
# detach the old one, data and all.
#
# Create it from the Render dashboard with New > Blueprint, pointing at this
# repo. Pushes to `main` deploy to development through
# `.github/workflows/ci-cd.yml`, once its tests pass; production gets the image
# development runs only when someone runs `.github/workflows/promote.yml`.
#
# Each service names its environment's tag, `:production` or `:development`,
# which `.github/workflows/deploy.yml` moves onto every image it deploys there.
# A Blueprint sync deploys the image the Blueprint names, so naming a fixed
# image here would roll the service back to it on the next sync; the moving
# tag keeps it on what it already runs. The tags must exist before a sync, and
# the package must be public, or Render needs a registry credential (`creds`).
# Spec: https://render.com/docs/blueprint-spec

services:
  # --- Production ---------------------------------------------------------------
  - type: web
    name: viloq
    runtime: image
    image:
      url: ghcr.io/ckcabang/viloq:production
    plan: 0.5c-512mb
    region: oregon
    # 200 once uvicorn is up, startup (which creates the tables) got through,
    # and Postgres answers. It also names the image, which CI waits for.
    healthCheckPath: /healthz
    envVars:
      # The image's uvicorn listens on 8000; Render otherwise expects 10000.
      - key: PORT
        value: "8000"
      # Render's internal URL, `postgresql://...`; `backend/config.py` adds the
      # psycopg driver to it.
      - key: VILOQ_DATABASE_URL
        fromDatabase:
          name: viloq-db
          property: connectionString
      # Off: with it on, the sign-in response hands back the token, so anyone
      # could sign in as any email. Until there is a mailer, sign-in links are
      # issued from the service's Shell: `python -m backend.issue_link <email>`.
      - key: VILOQ_EXPOSE_MAGIC_LINK
        value: "0"
      # Tags its traces and metrics; the image is the same in both services.
      - key: VILOQ_ENVIRONMENT
        value: production
      # Where traces and metrics go: Grafana Cloud's OTLP endpoint and its
      # `Authorization=Basic%20...` header (see `observability/README.md`).
      # Secrets, so set in the dashboard, never here; while the endpoint is
      # unset nothing is sent.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  # --- Development --------------------------------------------------------------
  # The same as production, on its own database.
  - type: web
    name: viloq-dev
    runtime: image
    image:
      url: ghcr.io/ckcabang/viloq:development
    plan: 0.5c-512mb
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: VILOQ_DATABASE_URL
        fromDatabase:
          name: viloq-dev-db
          property: connectionString
      - key: VILOQ_EXPOSE_MAGIC_LINK
        value: "0"
      - key: VILOQ_ENVIRONMENT
        value: development
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

databases:
  # --- Production ---------------------------------------------------------------
  - name: viloq-db
    databaseName: viloq
    user: viloq
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "18"
    # Reachable only from services in this workspace, not the internet.
    ipAllowList: []

  # --- Development --------------------------------------------------------------
  - name: viloq-dev-db
    databaseName: viloq
    user: viloq
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
