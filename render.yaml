# Render Blueprint: two independent copies of the app's image plus a managed
# Postgres, the same pair `compose.yaml` runs locally.
#
#   development  viloq       + viloq-db
#   production   viloq-prod  + viloq-prod-db
#
# Each service reads only its own database; nothing is shared between them.
# Development keeps the original names: renaming a resource here would make
# Render create a fresh one and detach the old one, data and all.
#
# Create it from the Render dashboard with New > Blueprint, pointing at this
# repo. Pushes to `main` deploy through `.github/workflows/ci-cd.yml`, once its
# tests pass: to development first, then to production.
# Spec: https://render.com/docs/blueprint-spec

services:
  # --- Development --------------------------------------------------------------
  - type: web
    name: viloq
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: oregon
    branch: main
    # Off: CI calls the deploy hook after the tests pass, rather than Render
    # deploying every commit on its own.
    autoDeployTrigger: "off"
    # 200 once uvicorn is up, startup (which creates the tables) got through,
    # and Postgres answers. It also names the commit, which CI waits for.
    healthCheckPath: /healthz
    envVars:
      # The image's uvicorn listens on 8000; Render otherwise expects 10000.
      - key: PORT
        value: "8000"
      # Render's internal URL, `postgresql://...`; `backend/config.py` adds the
      # psycopg driver to it.
      - key: VILOQ_DATABASE_URL
        fromDatabase:
          name: viloq-db
          property: connectionString
      # Off: with it on, the sign-in response hands back the token, so anyone
      # could sign in as any email. Sign-in needs a mailer before it works here.
      - key: VILOQ_EXPOSE_MAGIC_LINK
        value: "0"

  # --- Production ---------------------------------------------------------------
  # The same as development, on its own database.
  - type: web
    name: viloq-prod
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: VILOQ_DATABASE_URL
        fromDatabase:
          name: viloq-prod-db
          property: connectionString
      - key: VILOQ_EXPOSE_MAGIC_LINK
        value: "0"

databases:
  # --- Development --------------------------------------------------------------
  - name: viloq-db
    databaseName: viloq
    user: viloq
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "18"
    # Reachable only from services in this workspace, not the internet.
    ipAllowList: []

  # --- Production ---------------------------------------------------------------
  - name: viloq-prod-db
    databaseName: viloq
    user: viloq
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
