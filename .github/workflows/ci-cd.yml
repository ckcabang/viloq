# Tests every push and pull request; deploys `main` to Render once they pass,
# to development and then to production (see `render.yaml`).
#
#   backend ─┐
#            ├─ stack (integration + browser e2e against compose)
#   frontend ┘      └─ deploy-development ─ deploy-production   (main only)
#
# Both deploys run `deploy.yml`. Each needs, under Settings > Environments,
# that environment's own Render deploy hook:
#   development  secret RENDER_DEPLOY_HOOK_URL  viloq's Settings > Deploy Hook
#   production   secret RENDER_DEPLOY_HOOK_URL  viloq-prod's Settings > Deploy Hook
# and, under Settings > Secrets and variables > Actions:
#   secret RENDER_API_KEY  Account Settings > API Keys, to follow the deploys
# A repository-level RENDER_DEPLOY_HOOK_URL is the fallback for an environment
# without one; `deploy.yml` refuses it unless it names that environment's
# service. `render.yaml` turns Render's own auto-deploy off, so this is the
# only way a commit reaches either one.
#
# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, which moves to
# Ubuntu 26 from 2026-10-19: `playwright install --with-deps` only supports the
# Ubuntu releases each Playwright version knows. Move on once it supports 26.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      # Matches `db` in compose.yaml; the tests create `viloq_test` on it.
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: viloq
          POSTGRES_PASSWORD: viloq
          POSTGRES_DB: viloq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viloq -d viloq"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # The stack's suites run in the `stack` job, against the built image.
      - run: uv run pytest --ignore=tests/integration --ignore=tests/e2e

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Every module parses
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: node --test 'tests/**/*.test.js'

  stack:
    name: Integration and e2e tests
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    env:
      VILOQ_E2E_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start the stack
        run: docker compose up -d --build --wait
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Stack is healthy
        run: curl -fsS "$VILOQ_E2E_BASE_URL/healthz"
      - name: Integration tests
        run: uv run pytest tests/integration
      - name: End-to-end tests
        run: uv run pytest tests/e2e --tracing retain-on-failure
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy-development:
    name: Deploy to development
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      service: viloq
    secrets: inherit

  # Only once the same commit is live and healthy on development; skipped
  # whenever that is. Required reviewers on the `production` environment turn
  # this into a manual promotion.
  deploy-production:
    name: Deploy to production
    needs: deploy-development
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      service: viloq-prod
    secrets: inherit
