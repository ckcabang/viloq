# Tests every push and pull request; deploys `main` to Render once they pass.
#
#   backend ─┐
#            ├─ stack (integration + browser e2e against compose) ─ deploy (main only)
#   frontend ┘
#
# Deploying needs, under Settings > Secrets and variables > Actions:
#   secret   RENDER_DEPLOY_HOOK_URL  the web service's Settings > Deploy Hook
#   secret   RENDER_API_KEY          Account Settings > API Keys, to follow the deploy
#   variable RENDER_SERVICE_URL      its public URL, e.g. https://viloq.onrender.com
# `render.yaml` turns Render's own auto-deploy off, so this is the only way a
# commit reaches production.
#
# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest, which moves to
# Ubuntu 26 from 2026-10-19: `playwright install --with-deps` only supports the
# Ubuntu releases each Playwright version knows. Move on once it supports 26.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      # Matches `db` in compose.yaml; the tests create `viloq_test` on it.
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: viloq
          POSTGRES_PASSWORD: viloq
          POSTGRES_DB: viloq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viloq -d viloq"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # The stack's suites run in the `stack` job, against the built image.
      - run: uv run pytest --ignore=tests/integration --ignore=tests/e2e

  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Every module parses
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit tests
        run: node --test 'tests/**/*.test.js'

  stack:
    name: Integration and e2e tests
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    env:
      VILOQ_E2E_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start the stack
        run: docker compose up -d --build --wait
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Stack is healthy
        run: curl -fsS "$VILOQ_E2E_BASE_URL/healthz"
      - name: Integration tests
        run: uv run pytest tests/integration
      - name: End-to-end tests
        run: uv run pytest tests/e2e --tracing retain-on-failure
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Render
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    # Never cancel a deploy halfway; a newer push waits its turn instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger the deploy of this commit
        id: trigger
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK" || { echo "::error::RENDER_DEPLOY_HOOK_URL is not set"; exit 1; }
          # The hook URL already carries `?key=...`.
          response=$(curl -fsS -X POST "$HOOK&ref=$GITHUB_SHA")
          echo "$response"
          # A 200 names the new deploy. A 202 (one is already running, ours
          # queues behind it) may not, and the next step looks it up instead.
          echo "deploy_id=$(jq -r '.deploy.id // empty' <<<"$response" 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Wait for that deploy to go live
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY is not set"; exit 1; }
          # The hook is https://api.render.com/deploy/srv-...?key=...
          service_id=$(sed -E 's#.*/deploy/(srv-[^?/]+).*#\1#' <<<"$HOOK")
          [[ "$service_id" == srv-* ]] || { echo "::error::No service id in the deploy hook URL"; exit 1; }
          api() {
            curl -fsS --max-time 20 -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$service_id/$1"
          }

          # Follow this deploy, not merely whatever is live: a redeploy of a
          # commit that is already serving would otherwise pass at once, even
          # if the new deploy then failed.
          deadline=$((SECONDS + 20 * 60))
          while (( SECONDS < deadline )); do
            if [[ -z "$DEPLOY_ID" ]]; then
              DEPLOY_ID=$(api "deploys?limit=20" | jq -r --arg sha "$GITHUB_SHA" \
                '[.[].deploy | select(.commit.id == $sha)][0].id // empty' || true)
            fi
            if [[ -n "$DEPLOY_ID" ]]; then
              status=$(api "deploys/$DEPLOY_ID" | jq -r '.status' || echo unknown)
              echo "$(date -u +%T) $DEPLOY_ID $status"
              case "$status" in
                live)
                  echo "deploy $DEPLOY_ID is live"
                  exit 0 ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "::error::Render deploy $DEPLOY_ID ended $status: https://dashboard.render.com/web/$service_id/deploys/$DEPLOY_ID"
                  exit 1 ;;
              esac
            else
              echo "$(date -u +%T) waiting for Render to list a deploy of $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "::error::Render deploy ${DEPLOY_ID:-of $GITHUB_SHA} was not live within 20 minutes"
          exit 1

      - name: Check the live service is this commit and healthy
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          test -n "$SERVICE_URL" || { echo "::error::RENDER_SERVICE_URL is not set"; exit 1; }
          # Live means Render's own /healthz check passed and traffic moved
          # over; confirm from outside, allowing a moment for routing.
          for _ in $(seq 1 12); do
            body=$(curl -sS --max-time 10 "$SERVICE_URL/healthz" || true)
            echo "$(date -u +%T) $body"
            if [[ "$(jq -r '.status' <<<"$body" 2>/dev/null)" == ok &&
                  "$(jq -r '.commit' <<<"$body" 2>/dev/null)" == "$GITHUB_SHA" ]]; then
              echo "Deployed $GITHUB_SHA and healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SERVICE_URL/healthz did not report $GITHUB_SHA as healthy"
          exit 1
