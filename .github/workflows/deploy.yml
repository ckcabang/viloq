# Deploys the current commit to one Render service and waits until it is live
# and healthy. Called by `ci-cd.yml`, once per environment; never runs alone.
#
# Needs, in the GitHub environment it deploys to (Settings > Environments):
#   secret   RENDER_DEPLOY_HOOK_URL  that service's Settings > Deploy Hook
# and, there or for the whole repository:
#   secret   RENDER_API_KEY          Account Settings > API Keys, to follow the deploy
#
# An environment's secret overrides a repository secret of the same name, and
# a missing one silently falls back to it. So the first step asks Render which
# service the hook belongs to, and stops unless it is `service`: a hook meant
# for one environment can never deploy the other.

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which holds that service's deploy hook.
        required: true
        type: string
      service:
        description: The name of the Render service, in `render.yaml`, that it deploys.
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.service.outputs.url }}
    # Never cancel a deploy halfway; a newer push waits its turn instead.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check the deploy hook is ${{ inputs.service }}'s
        id: service
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED: ${{ inputs.service }}
        run: |
          test -n "$HOOK" || { echo "::error::RENDER_DEPLOY_HOOK_URL is not set"; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY is not set"; exit 1; }
          # The hook is https://api.render.com/deploy/srv-...?key=...
          service_id=$(sed -E 's#.*/deploy/(srv-[^?/]+).*#\1#' <<<"$HOOK")
          [[ "$service_id" == srv-* ]] || { echo "::error::No service id in the deploy hook URL"; exit 1; }
          service=$(curl -fsS --max-time 20 -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$service_id")
          name=$(jq -r '.name' <<<"$service")
          url=$(jq -r '.serviceDetails.url // empty' <<<"$service")
          if [[ "$name" != "$EXPECTED" ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL in the $ENVIRONMENT environment deploys $name ($service_id), not $EXPECTED. Set $EXPECTED's deploy hook under Settings > Environments > $ENVIRONMENT."
            exit 1
          fi
          [[ "$url" == https://* ]] || { echo "::error::Render reported no public URL for $name"; exit 1; }
          echo "$name ($service_id) at $url"
          echo "id=$service_id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Trigger the deploy of this commit
        id: trigger
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # The hook URL already carries `?key=...`.
          response=$(curl -fsS -X POST "$HOOK&ref=$GITHUB_SHA")
          echo "$response"
          # A 200 names the new deploy. A 202 (one is already running, ours
          # queues behind it) may not, and the next step looks it up instead.
          echo "deploy_id=$(jq -r '.deploy.id // empty' <<<"$response" 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Wait for that deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.service.outputs.id }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          api() {
            curl -fsS --max-time 20 -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/$1"
          }

          # Follow this deploy, not merely whatever is live: a redeploy of a
          # commit that is already serving would otherwise pass at once, even
          # if the new deploy then failed.
          deadline=$((SECONDS + 20 * 60))
          while (( SECONDS < deadline )); do
            if [[ -z "$DEPLOY_ID" ]]; then
              DEPLOY_ID=$(api "deploys?limit=20" | jq -r --arg sha "$GITHUB_SHA" \
                '[.[].deploy | select(.commit.id == $sha)][0].id // empty' || true)
            fi
            if [[ -n "$DEPLOY_ID" ]]; then
              status=$(api "deploys/$DEPLOY_ID" | jq -r '.status' || echo unknown)
              echo "$(date -u +%T) $DEPLOY_ID $status"
              case "$status" in
                live)
                  echo "deploy $DEPLOY_ID is live"
                  exit 0 ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "::error::Render deploy $DEPLOY_ID ended $status: https://dashboard.render.com/web/$SERVICE_ID/deploys/$DEPLOY_ID"
                  exit 1 ;;
              esac
            else
              echo "$(date -u +%T) waiting for Render to list a deploy of $GITHUB_SHA"
            fi
            sleep 15
          done
          echo "::error::Render deploy ${DEPLOY_ID:-of $GITHUB_SHA} was not live within 20 minutes"
          exit 1

      - name: Check the live service is this commit and healthy
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          # Live means Render's own /healthz check passed and traffic moved
          # over; confirm from outside, allowing a moment for routing.
          for _ in $(seq 1 12); do
            body=$(curl -sS --max-time 10 "$SERVICE_URL/healthz" || true)
            echo "$(date -u +%T) $body"
            if [[ "$(jq -r '.status' <<<"$body" 2>/dev/null)" == ok &&
                  "$(jq -r '.commit' <<<"$body" 2>/dev/null)" == "$GITHUB_SHA" ]]; then
              echo "Deployed $GITHUB_SHA and healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SERVICE_URL/healthz did not report $GITHUB_SHA as healthy"
          exit 1
