# Deploys one image from GitHub's container registry to one Render service and
# waits until it is live and healthy. Render pulls the image; it builds
# nothing. Called by `ci-cd.yml` (to development) and `promote.yml` (to
# production); never runs alone.
#
# Once the image is live, it moves the environment's own tag (`development` or
# `production`) onto it. That tag is what `render.yaml` names, so a Blueprint
# sync, which redeploys whatever image the Blueprint names, keeps the image
# the environment already runs instead of rolling it back.
#
# The caller must grant `packages: write`, to move that tag.
#
# Needs, in the GitHub environment it deploys to (Settings > Environments):
#   secret   RENDER_DEPLOY_HOOK_URL  that service's Settings > Deploy Hook
# and, there or for the whole repository:
#   secret   RENDER_API_KEY          Account Settings > API Keys, to follow the deploy
#
# An environment's secret overrides a repository secret of the same name, and
# a missing one silently falls back to it. So the first step asks Render which
# service the hook belongs to, and stops unless it is `service`: a hook meant
# for one environment can never deploy the other.

name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment, which holds that service's deploy hook.
        required: true
        type: string
      service:
        description: The name of the Render service, in `render.yaml`, that it deploys.
        required: true
        type: string
      tag:
        description: The image to deploy, by its YYYYMMDD-HHMMSS-shortsha tag in ghcr.io/ckcabang/viloq.
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  # Also in `ci-cd.yml` and `render.yaml`; Render rejects a deploy from any
  # other repository than the one the service names.
  IMAGE: ghcr.io/ckcabang/viloq

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.service.outputs.url }}
    # Never cancel a deploy halfway; a newer push waits its turn instead.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check ${{ inputs.tag }} is in the registry
        run: |
          [[ "$TAG" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]] || { echo "::error::$TAG is not a YYYYMMDD-HHMMSS-shortsha tag"; exit 1; }
          docker buildx imagetools inspect "$IMAGE:$TAG" || { echo "::error::$IMAGE:$TAG is not in the registry"; exit 1; }

      - name: Check the deploy hook is ${{ inputs.service }}'s, and it can pull an image
        id: service
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED: ${{ inputs.service }}
        run: |
          test -n "$HOOK" || { echo "::error::RENDER_DEPLOY_HOOK_URL is not set"; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "::error::RENDER_API_KEY is not set"; exit 1; }
          # The hook is https://api.render.com/deploy/srv-...?key=...
          service_id=$(sed -E 's#.*/deploy/(srv-[^?/]+).*#\1#' <<<"$HOOK")
          [[ "$service_id" == srv-* ]] || { echo "::error::No service id in the deploy hook URL"; exit 1; }
          service=$(curl -fsS --max-time 20 -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$service_id")
          name=$(jq -r '.name' <<<"$service")
          url=$(jq -r '.serviceDetails.url // empty' <<<"$service")
          if [[ "$name" != "$EXPECTED" ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL in the $ENVIRONMENT environment deploys $name ($service_id), not $EXPECTED. Set $EXPECTED's deploy hook under Settings > Environments > $ENVIRONMENT."
            exit 1
          fi
          [[ "$url" == https://* ]] || { echo "::error::Render reported no public URL for $name"; exit 1; }
          echo "$name ($service_id) at $url"

          # Render refuses the hook below, with little to say why, for a
          # suspended service or one that does not pull an image; say so here.
          if [[ "$(jq -r '.suspended' <<<"$service")" == suspended ]]; then
            echo "::error::$name is suspended; resume it in the Render dashboard, then re-run this job"
            exit 1
          fi
          runtime=$(jq -r '.serviceDetails.runtime // .serviceDetails.env // empty' <<<"$service")
          if [[ -n "$runtime" && "$runtime" != image ]]; then
            echo "::error::$name runs as '$runtime', not 'image', so it cannot pull $IMAGE. Sync the Blueprint (render.yaml) in the Render dashboard; Render rejects the sync until $IMAGE:$ENVIRONMENT exists."
            exit 1
          fi
          # Only a warning: Render itself rejects an image from another
          # repository, and says so below.
          image_path=$(jq -r '.imagePath // empty' <<<"$service")
          echo "$name pulls $image_path"
          [[ "$image_path" == "$IMAGE:"* || "$image_path" == "$IMAGE@"* ]] ||
            echo "::warning::$name pulls '$image_path', not from $IMAGE; Render may refuse $IMAGE:$TAG"
          echo "id=$service_id" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Trigger the deploy of ${{ inputs.tag }}
        id: trigger
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # The hook URL already carries `?key=...`; `imgURL` picks the image,
          # which must be in the repository the service is set to pull from.
          img=$(jq -rn --arg url "$IMAGE:$TAG" '$url | @uri')
          # Keep Render's answer on a refusal too; it is the only reason given.
          # Never echo the hook itself: its URL carries the key.
          status=$(curl -sS -o "$RUNNER_TEMP/hook.json" -w '%{http_code}' -X POST "$HOOK&imgURL=$img")
          response=$(cat "$RUNNER_TEMP/hook.json")
          echo "$status $response"
          if [[ "$status" != 200 && "$status" != 202 ]]; then
            case "$status" in
              400) why="it rejected $IMAGE:$TAG; the service must be an image service pulling from $IMAGE" ;;
              401) why="the deploy hook's key is wrong; copy it again from the service's Settings > Deploy Hook" ;;
              404) why="the service in the deploy hook no longer exists" ;;
              409) why="the service is suspended; resume it in the Render dashboard" ;;
              *) why="see its response above" ;;
            esac
            echo "::error::Render refused the deploy ($status): $why"
            exit 1
          fi
          # A 200 names the new deploy. A 202 (one is already running, ours
          # queues behind it) may not, and the next step looks it up instead.
          echo "deploy_id=$(jq -r '.deploy.id // empty' <<<"$response" 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Wait for that deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.service.outputs.id }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          api() {
            curl -fsS --max-time 20 -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/$1"
          }

          # Follow this deploy, not merely whatever is live: a redeploy of a
          # commit that is already serving would otherwise pass at once, even
          # if the new deploy then failed.
          deadline=$((SECONDS + 20 * 60))
          while (( SECONDS < deadline )); do
            if [[ -z "$DEPLOY_ID" ]]; then
              DEPLOY_ID=$(api "deploys?limit=20" | jq -r --arg tag ":$TAG" \
                '[.[].deploy | select((.image.ref // "") | contains($tag))][0].id // empty' || true)
            fi
            if [[ -n "$DEPLOY_ID" ]]; then
              status=$(api "deploys/$DEPLOY_ID" | jq -r '.status' || echo unknown)
              echo "$(date -u +%T) $DEPLOY_ID $status"
              case "$status" in
                live)
                  echo "deploy $DEPLOY_ID is live"
                  exit 0 ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                  echo "::error::Render deploy $DEPLOY_ID ended $status: https://dashboard.render.com/web/$SERVICE_ID/deploys/$DEPLOY_ID"
                  exit 1 ;;
              esac
            else
              echo "$(date -u +%T) waiting for Render to list a deploy of $TAG"
            fi
            sleep 15
          done
          echo "::error::Render deploy ${DEPLOY_ID:-of $TAG} was not live within 20 minutes"
          exit 1

      - name: Check the live service is this image and healthy
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          # Live means Render's own /healthz check passed and traffic moved
          # over; confirm from outside, allowing a moment for routing.
          for _ in $(seq 1 12); do
            body=$(curl -sS --max-time 10 "$SERVICE_URL/healthz" || true)
            echo "$(date -u +%T) $body"
            if [[ "$(jq -r '.status' <<<"$body" 2>/dev/null)" == ok &&
                  "$(jq -r '.image' <<<"$body" 2>/dev/null)" == "$TAG" ]]; then
              echo "Deployed $IMAGE:$TAG and healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SERVICE_URL/healthz did not report $TAG as healthy"
          exit 1

      - name: Tag ${{ inputs.tag }} as ${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          # Only once it is live: until then, the tag still names what runs.
          # `--prefer-index=false` copies the image as it is, so the tag has
          # its very digest, rather than a new list wrapping it.
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$ENVIRONMENT" "$IMAGE:$TAG"
          {
            echo "### Deployed to $ENVIRONMENT"
            echo
            echo "\`$IMAGE:$TAG\`, now also \`$IMAGE:$ENVIRONMENT\`, at $SERVICE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
